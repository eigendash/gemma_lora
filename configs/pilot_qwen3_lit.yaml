# Literature-aligned GRPO pilot (DAPO / SimpleTIR / rStar2 / Gandhi et al.), from BASE Qwen3-4B.
# vs pilot_qwen3_soos.yaml: 4x prompts per step, DAPO dynamic sampling, T=0.9, no KL penalty,
# retry-instruction prompt (A/B: the instruction alone makes the base model retry 72% of failed checks).
model: Qwen/Qwen3-4B-Base
prompt_style: fewshot_direct_retry
n_problems: 0
G: 8
prompts_per_step: 32
grad_accum: 1
total_steps: 200
max_new_tokens: 384
lr: 0.00002
kl_coef: 0.0
min_kl_coef: 0.0
max_kl_coef: 0.0
target_kl: 0.1
lora_r: 16
lora_alpha: 32
dtype: bfloat16
attn: sdpa
chunked_vocab: true
micro_batch: 8
generation: batched
gen_batch: 128
dynamic_sampling: true
max_refill_rounds: 2
checkpoint_every: 10
checkpoint_timer: 900
rollout_dump_every: 5
temperature: 0.9
on_round_cap: notice
