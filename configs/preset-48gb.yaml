# Hardware preset: 40-48 GB VRAM (A100 40GB / A6000 / L40S).
# Effective batch = 8 * 8 * 2 = 128 (constant). Expected to fit the main GRPO run.
model: google/gemma-2-2b
G: 8
prompts_per_step: 8
grad_accum: 2
total_steps: 2000
max_new_tokens: 512
lr: 0.00001
clip_eps: 0.2
kl_coef: 0.02
target_kl: 0.1
kl_adapt_rate: 2.0
min_kl_coef: 0.001
max_kl_coef: 1.0
lora_r: 16
lora_alpha: 32
checkpoint_every: 20
checkpoint_timer: 600
chunked_vocab: true
attn: eager
dtype: bfloat16
n_problems: 0        # 0 = all 10,000 train problems
micro_batch: 8       # rollouts per forward/backward in the loss pass (memory knob; not part of the resume hash)
temperature: 1.0
generation: batched
gen_batch: 64        # sequences per batched decode (KV-cache memory knob)
