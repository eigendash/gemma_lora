# 10-minute cloud smoke config (RUN_STAGE=smoke): records step time, tokens/s and
# peak GPU memory before the main run. NOT run (Mac only).
model: google/gemma-2-2b
G: 4
prompts_per_step: 1
grad_accum: 1
total_steps: 10
max_new_tokens: 256
lr: 0.00001
kl_coef: 0.02
target_kl: 0.1
min_kl_coef: 0.001
max_kl_coef: 1.0
checkpoint_every: 5
checkpoint_timer: 300
chunked_vocab: true
attn: eager
dtype: bfloat16
n_problems: 200
micro_batch: 4
generation: batched
gen_batch: 4
