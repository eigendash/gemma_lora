# GRPO pilot from BASE Qwen3-4B (no SFT), format-only 1-shot prompt. Run on soos (Strix Halo, ROCm).
# Batch: 8 prompts x G=8 = 64 rollouts/step. bf16 base + fp32 LoRA (PEFT autocast).
# T=0.7: base Qwen3 at T=1.0 scores ~0/24 vs 0.7 ~17-19% (n=48); log-probs are computed at the same T.
# on_round_cap=notice: a 3rd code block is never executed (spec cap), the model is told and can answer.
model: Qwen/Qwen3-4B-Base
prompt_style: fewshot_direct
n_problems: 0
G: 8
prompts_per_step: 8
grad_accum: 1
total_steps: 200
max_new_tokens: 384
lr: 0.00002
kl_coef: 0.01
target_kl: 0.1
min_kl_coef: 0.001
max_kl_coef: 1.0
lora_r: 16
lora_alpha: 32
dtype: bfloat16
attn: sdpa
chunked_vocab: true
micro_batch: 8
generation: batched
gen_batch: 64
checkpoint_every: 20
checkpoint_timer: 900
rollout_dump_every: 10
temperature: 0.7
on_round_cap: notice
