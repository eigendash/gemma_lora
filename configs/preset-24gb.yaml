# Hardware preset: 24 GB VRAM (4090 / 3090 / L4 class).
# Effective batch = G * prompts_per_step * grad_accum = 8 * 4 * 4 = 128 (kept
# constant across presets). Expected to fit the SMOKE + SFT stages; the main
# GRPO run at this VRAM is possible but slow (estimate, not verified).
model: google/gemma-2-2b
G: 8
prompts_per_step: 4
grad_accum: 4
total_steps: 2000
max_new_tokens: 512
lr: 0.00001
clip_eps: 0.2
kl_coef: 0.02
target_kl: 0.1
kl_adapt_rate: 2.0
min_kl_coef: 0.001
max_kl_coef: 1.0
lora_r: 16
lora_alpha: 32
checkpoint_every: 20
checkpoint_timer: 600
chunked_vocab: true
attn: eager
dtype: bfloat16
n_problems: 0        # 0 = all 10,000 train problems
micro_batch: 4       # rollouts per forward/backward in the loss pass (memory knob; not part of the resume hash)
temperature: 1.0
generation: batched
gen_batch: 32        # sequences per batched decode (KV-cache memory knob)
