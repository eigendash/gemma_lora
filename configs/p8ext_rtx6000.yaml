# P8 extension: identical to p8_rtx6000.yaml except total_steps 100 -> 135 (total_steps is not hashed, so --resume auto continues P8 from step 100).
# P8: P7's recipe (configs/p7_rtx6000.yaml) + the multi-candidate prompt, starting from P7 step 40.
# Why (EXPERIMENTS.md §2.7c): P7 plateaued at P6's level (~100/300 val). 97% of its wrong answers were
# "both checks False -> 3rd guess unchecked". With one candidate per execution and SPEC's 2-execution
# cap, it only gets ~3 guesses. `fewshot_multi_retry` demonstrates checking several candidates in ONE
# <python> block (a for-loop over a tuple, allowed by the sandbox), so 2 executions cover ~10 candidates.
# P7 s40 already scores 104/300 under this prompt (102 under the old one); base drops 46 -> 32.
# init_lora: P7 s40 LoRA weights are the initial trainable adapter (unmerged; bf16 merge cost 104 -> 92).
# micro_batch 4: the multi prompt/completions are longer; micro_batch 8 OOMed (93 GB) in the loss pass.
init_lora: baselines/p7_s40
model: Qwen/Qwen3-4B-Base
prompt_style: fewshot_multi_retry
n_problems: 0
G: 8
prompts_per_step: 64
grad_accum: 1
total_steps: 135
max_new_tokens: 768
lr: 0.00002
kl_coef: 0.01
target_kl: 0.1
min_kl_coef: 0.001
max_kl_coef: 0.2
lora_r: 16
lora_alpha: 32
dtype: bfloat16
attn: sdpa
chunked_vocab: true
micro_batch: 4
grad_ckpt: false
generation: vllm
vllm_gpu_util: 0.6
vllm_sleep: true
vllm_max_model_len: 4096
dynamic_sampling: true
max_refill_rounds: 2
curriculum_mode: signal
curriculum_group_window: 64
zero_shaping_invalid_literals: true
val_n: 300
val_every: 5
checkpoint_every: 5
checkpoint_timer: 900
rollout_dump_every: 5
temperature: 0.9
on_round_cap: notice
updates_per_batch: 2
clip_eps_high: 0.28
tis_cap: 2.0
length_threshold: 512
guard_window: 5
guard_contradicted: 0.6
guard_max_length: 0.4
