# Qwen3-8B long continuation (2026-11-08): keep training the best model (q8b-d s80, holdout3 557) to see how far
# accuracy keeps rising. Same settings as the lineage's phase d, except: no hints (EXPERIMENTS.md section 2.7m: no
# effect), up to 300 more steps, LR warmup 5 (fresh AdamW), checkpoint every 4 steps or 5 min.
# Budget: max_total_usd 36 at cost_per_hour 2.0 = 18 training GPU-hours; the trainer saves and stops cleanly when
# reached, the chain then evaluates the last checkpoint and powers the VM off; the VM also has a 21 h max lifetime.
model: Qwen/Qwen3-8B-Base
prompt_style: fewshot_multi_retry
n_problems: 0
G: 8
prompts_per_step: 64
grad_accum: 1
total_steps: 300
max_new_tokens: 768
lr: 2.0e-05
lr_warmup_steps: 5
kl_coef: 0.01
target_kl: 0.1
min_kl_coef: 0.001
max_kl_coef: 0.2
lora_r: 16
lora_alpha: 32
dtype: bfloat16
attn: sdpa
chunked_vocab: true
micro_batch: 4
grad_ckpt: false
generation: vllm
vllm_gpu_util: 0.6
vllm_sleep: true
vllm_max_model_len: 4096
dynamic_sampling: true
max_refill_rounds: 2
curriculum_mode: signal
curriculum_group_window: 64
zero_shaping_invalid_literals: true
val_n: 300
val_every: 5
checkpoint_every: 4
checkpoint_timer: 300
rollout_dump_every: 5
temperature: 0.9
on_round_cap: notice
updates_per_batch: 2
clip_eps_high: 0.28
tis_cap: 2.0
length_threshold: 512
guard_window: 5
guard_contradicted: 0.6
guard_max_length: 0.4
hint_schedule: ''
hint_max_groups: 16
seed: 0
init_lora: baselines/q8b-d_final
max_total_usd: 36.0
